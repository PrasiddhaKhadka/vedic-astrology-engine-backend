services:
  - type: web
    name: astrogyan-api
    runtime: python
    region: singapore          # closest to Nepal/India — change to oregon/frankfurt if needed
    plan: free                 # upgrade to starter ($7/mo) for always-on

    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info"

    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      - key: DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true       # Render auto-generates a secure secret

      - key: ALLOWED_HOSTS
        value: ".onrender.com"    # update after deploy with your custom domain

      # ── CORS ──────────────────────────────────────────────────────────────────
      # No frontend URL yet — allow all origins so frontend devs can test from
      # their local machines (localhost:3000, localhost:5173, etc.)
      # Once you have a real frontend URL, set this to False and add:
      #   - key: CORS_ALLOW_ALL_ORIGINS
      #     value: "False"
      #   - key: CORS_ALLOWED_ORIGINS
      #     value: "https://yourfrontend.com,https://app.astrogyan.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

      - key: DATABASE_URL
        fromDatabase:
          name: astrogyan-db
          property: connectionString

      - key: WEB_CONCURRENCY
        value: "2"

# ── Free PostgreSQL database ───────────────────────────────────────────────────
databases:
  - name: astrogyan-db
    databaseName: astrogyan
    user: astrogyan
    region: singapore
    plan: free                 # 1GB storage, expires after 90 days on free tier
                              